<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" aria-hidden="true">
  <defs>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C4B8"/>
      <stop offset="100%" stop-color="#C4988A"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA98A"/>
      <stop offset="100%" stop-color="#5C7A54"/>
    </linearGradient>
  </defs>
  <!-- Central Garland Line -->
  <path d="M 0 50 Q 200 150, 400 100 T 800 50" fill="none" stroke="#5C7A54" stroke-width="4" stroke-linecap="round"/>
  <!-- Central Rose -->
  <g transform="translate(400, 100) scale(1.5)">
    <circle cx="0" cy="0" r="20" fill="url(#rose-grad)" />
    <path d="M -10 -5 Q 0 -15, 10 -5 Q 15 5, 5 10 Q -5 15, -10 5 Z" fill="#FDF8F0" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#D4A843" />
  </g>
  <!-- Left Side Roses & Leaves -->
  <g transform="translate(200, 100) scale(1.2)">
    <circle cx="0" cy="0" r="15" fill="url(#rose-grad)" />
    <path d="M -20 10 C -30 20, -10 30, -5 20 Z" fill="url(#leaf-grad)"/>
    <path d="M 10 -15 C 20 -25, 30 -5, 20 0 Z" fill="url(#leaf-grad)"/>
  </g>
  <g transform="translate(100, 70)">
    <path d="M 0 0 C 10 -15, 25 -5, 15 5 Z" fill="url(#leaf-grad)"/>
  </g>
  <!-- Right Side Roses & Leaves -->
  <g transform="translate(600, 80) scale(1.2)">
    <circle cx="0" cy="0" r="15" fill="url(#rose-grad)" />
    <path d="M 20 10 C 30 20, 10 30, 5 20 Z" fill="url(#leaf-grad)"/>
    <path d="M -10 -15 C -20 -25, -30 -5, -20 0 Z" fill="url(#leaf-grad)"/>
  </g>
  <g transform="translate(700, 60)">
    <path d="M 0 0 C -10 -15, -25 -5, -15 5 Z" fill="url(#leaf-grad)"/>
  </g>
  <!-- Small Gold Berries -->
  <circle cx="250" cy="120" r="4" fill="#D4A843"/>
  <circle cx="350" cy="80" r="4" fill="#D4A843"/>
  <circle cx="450" cy="80" r="4" fill="#D4A843"/>
  <circle cx="550" cy="110" r="4" fill="#D4A843"/>
</svg>
