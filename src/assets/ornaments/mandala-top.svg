<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none">
  <defs>
    <linearGradient id="gold-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9B867" stop-opacity="0"/>
      <stop offset="30%" stop-color="#D9B867" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F1D993"/>
      <stop offset="70%" stop-color="#D9B867" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D9B867" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Horizontal rule -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="url(#gold-h)" stroke-width="0.8"/>
  <!-- Center mandala -->
  <g transform="translate(400,60)">
    <circle r="28" stroke="#D9B867" stroke-width="0.7" stroke-opacity="0.6" fill="none"/>
    <circle r="20" stroke="#D9B867" stroke-width="0.5" stroke-opacity="0.5" fill="none"/>
    <circle r="12" stroke="#F1D993" stroke-width="0.6" stroke-opacity="0.7" fill="none"/>
    <circle r="4" fill="#D9B867" fill-opacity="0.8"/>
    <!-- Petal spokes -->
    <g stroke="#D9B867" stroke-width="0.6" stroke-opacity="0.5">
      <line x1="0" y1="-28" x2="0" y2="-20"/>
      <line x1="0" y1="20" x2="0" y2="28"/>
      <line x1="-28" y1="0" x2="-20" y2="0"/>
      <line x1="20" y1="0" x2="28" y2="0"/>
      <line x1="-19.8" y1="-19.8" x2="-14.1" y2="-14.1"/>
      <line x1="14.1" y1="-14.1" x2="19.8" y2="-19.8"/>
      <line x1="-19.8" y1="19.8" x2="-14.1" y2="14.1"/>
      <line x1="14.1" y1="14.1" x2="19.8" y2="19.8"/>
    </g>
    <!-- Diamond motif -->
    <path d="M0,-8 L8,0 L0,8 L-8,0 Z" stroke="#D9B867" stroke-width="0.5" stroke-opacity="0.6" fill="none"/>
  </g>
  <!-- Left chain -->
  <g stroke="#D9B867" stroke-width="0.6" stroke-opacity="0.45" fill="none">
    <line x1="372" y1="60" x2="60" y2="60"/>
    <path d="M340,60 L330,50 L320,60 L330,70 Z"/>
    <path d="M280,60 L270,50 L260,60 L270,70 Z"/>
    <path d="M220,60 L210,50 L200,60 L210,70 Z"/>
    <path d="M160,60 L150,50 L140,60 L150,70 Z"/>
    <path d="M100,60 L90,50 L80,60 L90,70 Z"/>
  </g>
  <!-- Right chain (mirror) -->
  <g stroke="#D9B867" stroke-width="0.6" stroke-opacity="0.45" fill="none">
    <line x1="428" y1="60" x2="740" y2="60"/>
    <path d="M460,60 L470,50 L480,60 L470,70 Z"/>
    <path d="M520,60 L530,50 L540,60 L530,70 Z"/>
    <path d="M580,60 L590,50 L600,60 L590,70 Z"/>
    <path d="M640,60 L650,50 L660,60 L650,70 Z"/>
    <path d="M700,60 L710,50 L720,60 L710,70 Z"/>
  </g>
  <!-- Corner florals left -->
  <g transform="translate(40,60)" stroke="#D9B867" stroke-width="0.5" stroke-opacity="0.5" fill="none">
    <circle r="8"/>
    <circle r="14" stroke-dasharray="2 3"/>
    <path d="M0,-8 L3,-3 L8,-5 L5,0 L8,5 L3,3 L0,8 L-3,3 L-8,5 L-5,0 L-8,-5 L-3,-3 Z"/>
  </g>
  <!-- Corner florals right -->
  <g transform="translate(760,60)" stroke="#D9B867" stroke-width="0.5" stroke-opacity="0.5" fill="none">
    <circle r="8"/>
    <circle r="14" stroke-dasharray="2 3"/>
    <path d="M0,-8 L3,-3 L8,-5 L5,0 L8,5 L3,3 L0,8 L-3,3 L-8,5 L-5,0 L-8,-5 L-3,-3 Z"/>
  </g>
  <!-- Top border flourish -->
  <path d="M200,60 Q250,30 300,60 Q350,90 400,60 Q450,30 500,60 Q550,90 600,60" stroke="#D9B867" stroke-width="0.4" stroke-opacity="0.25" fill="none"/>
</svg>
