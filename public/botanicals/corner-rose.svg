<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" aria-hidden="true">
  <defs>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C4B8"/>
      <stop offset="100%" stop-color="#C4988A"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA98A"/>
      <stop offset="100%" stop-color="#5C7A54"/>
    </linearGradient>
  </defs>
  <g transform="translate(75, 75)">
    <!-- Leaves -->
    <path d="M 10 10 C 40 10, 50 40, 20 40 Z" fill="url(#leaf-grad)"/>
    <path d="M 10 10 C 10 40, 40 50, 40 20 Z" fill="url(#leaf-grad)"/>
    <path d="M -10 -10 C -40 -10, -50 -40, -20 -40 Z" fill="url(#leaf-grad)"/>
    <path d="M 10 -10 C 40 -10, 50 -40, 20 -40 Z" fill="url(#leaf-grad)"/>
    <!-- Central Rose -->
    <circle cx="0" cy="0" r="25" fill="url(#rose-grad)"/>
    <!-- Petal Details -->
    <path d="M -15 -10 Q 0 -25, 15 -10 Q 20 5, 5 15 Q -10 20, -15 -10 Z" fill="#FDF8F0" opacity="0.5"/>
    <!-- Center Gold -->
    <circle cx="0" cy="0" r="6" fill="#D4A843"/>
    <!-- Dots -->
    <circle cx="35" cy="5" r="3" fill="#D4A843"/>
    <circle cx="5" cy="35" r="3" fill="#D4A843"/>
  </g>
</svg>
